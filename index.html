<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lista de la Compra Compartida</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <!-- manifest.json no declara theme_color a propósito: el spec de Web App Manifest no admite
       variarlo por prefers-color-scheme, así que un valor fijo ahí ganaba sobre estos dos meta
       (Chrome usaba el claro del manifest para la barra de gestos de Android incluso en modo
       oscuro). Sin theme_color en el manifest, Chrome cae a estos meta dinámicos. -->
  <meta name="theme-color" content="#fafaee" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12140d" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lista Compra" />
</head>
<body>
  <div id="app-root" data-testid="app-root">
    <header class="app-header" data-testid="app-header">
      <h1><span class="ph-icon-inline" aria-hidden="true"><svg width="1em" height="1em" viewBox="0 0 256 256" fill="currentColor" style="vertical-align:-0.125em"><path d="M230.14,58.87A8,8,0,0,0,224,56H62.68L56.6,22.57A8,8,0,0,0,48.73,16H24a8,8,0,0,0,0,16h18L67.56,172.29a24,24,0,0,0,5.33,11.27,28,28,0,1,0,44.4,8.44h45.42A27.75,27.75,0,0,0,160,204a28,28,0,1,0,28-28H91.17a8,8,0,0,1-7.87-6.57L80.13,152h116a24,24,0,0,0,23.61-19.71l12.16-66.86A8,8,0,0,0,230.14,58.87ZM104,204a12,12,0,1,1-12-12A12,12,0,0,1,104,204Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,200,204Zm4-74.57A8,8,0,0,1,196.1,136H77.22L65.59,72H214.41Z"/></svg></span> Lista de la Compra</h1>
    </header>
    <main id="app-main" data-testid="app-main"></main>
  </div>

  <!-- Síncrono e inline a propósito: al entrar directo en /{householdId} (recarga completa
       de página), el <script type="module"> de main.js se descarga/ejecuta después del
       primer pintado, así que en conexiones lentas se llegaba a ver un instante la cabecera
       estática "Lista de la Compra" con el <main> vacío antes de que el JS lo corrigiera. Este
       script corre durante el parseo del HTML, antes de pintar nada, así que oculta la
       cabecera y monta el skeleton sin que llegue a haber ese hueco. -->
  <script>
    (function () {
      var hasHouseholdId = location.pathname.replace(/^\/+/, '').split('/')[0];
      if (!hasHouseholdId) return;

      var header = document.querySelector('.app-header');
      if (header) header.hidden = true;

      var main = document.getElementById('app-main');
      if (main) {
        main.innerHTML = Array.from({ length: 5 })
          .map(function () {
            return '<div class="skeleton-list-row" aria-hidden="true"><div class="skeleton-block"></div><div class="skeleton-block"></div></div>';
          })
          .join('');
      }
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
